name: Firmware updates

# Weekly: ask each firmware's public release feed for news and compare its licence file. Opens (or updates) one issue when something needs a human to read it.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check
        id: check
        run: |
          set +e
          python3 scripts/check-firmware-updates.py --pack . --licence-all | tee updates.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update the issue when something changed
        if: steps.check.outputs.code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'scripts/check-firmware-updates.py found something to read:\n\n```\n%s\n```\n\nRead the new licence files before bundling an update (README, "Rules for what goes in"). Run `scripts/check-firmware-updates.py --write-seen` after reviewing the watch list.' "$(cat updates.txt)")"
          existing="$(gh issue list --label firmware-updates --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "Firmware updates or licence changes" --label firmware-updates --body "$body"; fi
